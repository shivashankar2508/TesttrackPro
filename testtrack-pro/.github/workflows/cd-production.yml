name: CD - Deploy to Production

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy'
        required: false
        type: string

jobs:
  validate-production:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Validate main branch only
      run: |
        if [ "${{ github.ref }}" != "refs/heads/main" ] && [ "${{ github.ref_type }}" != "tag" ]; then
          echo "Production deployments only from main branch or tags"
          exit 1
        fi
    
    - name: Check for version tag
      run: |
        VERSION=${{ github.ref }}
        if [[ ! $VERSION =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
          echo "Production deployment requires semantic version tag (v1.2.3)"
          exit 1
        fi

  deploy-production:
    runs-on: ubuntu-latest
    needs: validate-production
    
    environment:
      name: production
      url: https://testtrack.example.com
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Determine version
      id: version
      run: |
        if [ "${{ github.ref_type }}" = "tag" ]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION=$(git describe --tags --always)
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Deploying version: $VERSION"
    
    - name: Create deployment
      id: deployment
      uses: actions/github-script@v6
      with:
        script: |
          const deployment = await github.rest.repos.createDeployment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: context.ref,
            environment: 'production',
            description: 'Production deployment ${{ steps.version.outputs.version }}',
            auto_merge: false,
            required_contexts: []
          });
          console.log('Deployment created:', deployment.data.id);
          return deployment.data.id;
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ secrets.DOCKER_REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_REGISTRY }}/testtrack-pro:latest
          ${{ secrets.DOCKER_REGISTRY }}/testtrack-pro:${{ steps.version.outputs.version }}
    
    - name: Configure SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/prod_key
        chmod 600 ~/.ssh/prod_key
        ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts
    
    - name: Pre-deployment checks
      run: |
        ssh -i ~/.ssh/prod_key ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          echo "Current disk usage:"
          df -h
          
          echo "Current memory usage:"
          free -h
          
          echo "Docker status:"
          docker ps
          
          echo "Database connectivity:"
          docker exec testtrack-pro-mysql mysql -h localhost -u testtrack -p${MYSQL_PASSWORD} -e "SELECT 1;" || exit 1
        EOF
    
    - name: Backup database
      run: |
        ssh -i ~/.ssh/prod_key ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          BACKUP_DIR="/opt/testtrack-pro/backups"
          mkdir -p $BACKUP_DIR
          
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          BACKUP_FILE="$BACKUP_DIR/testtrack_pro_$TIMESTAMP.sql.gz"
          
          docker exec testtrack-pro-mysql mysqldump \
            -h localhost \
            -u testtrack \
            -p${MYSQL_PASSWORD} \
            testtrack_pro | gzip > $BACKUP_FILE
          
          echo "Database backed up to: $BACKUP_FILE"
          
          # Keep only last 7 backups
          ls -t $BACKUP_DIR/*.sql.gz | tail -n +8 | xargs -r rm
        EOF
    
    - name: Deploy to Production
      run: |
        ssh -i ~/.ssh/prod_key ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          cd /opt/testtrack-pro
          
          echo "Deploying version: ${{ steps.version.outputs.version }}"
          
          # Pull latest code
          git fetch origin
          git checkout main
          git pull origin main
          
          # Update environment for production
          cp .env.production .env
          
          # Pull latest Docker image
          docker pull ${{ secrets.DOCKER_REGISTRY }}/testtrack-pro:latest
          
          # Stop old services gracefully
          echo "Stopping old services..."
          docker-compose stop
          
          # Start new services
          echo "Starting new services..."
          docker-compose up -d
          
          # Wait for services to be healthy
          echo "Waiting for services to be healthy..."
          for i in {1..30}; do
            if curl -f http://localhost:5000/health > /dev/null 2>&1; then
              echo "Services are healthy"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          
          # Run database migrations
          echo "Running database migrations..."
          docker exec testtrack-pro-backend python database/migrate.py || exit 1
          
          # Verify deployment
          echo "Verifying deployment..."
          curl -f http://localhost:5000/health || exit 1
          
          echo "Deployment successful!"
        EOF
    
    - name: Run production smoke tests
      run: |
        npm install -g newman
        newman run ./tests/postman/testtrack-pro-production.json \
          --environment ./tests/postman/production.environment.json \
          --reporters cli,json \
          --reporter-json-export production-results.json
      continue-on-error: true
    
    - name: Create deployment status success
      if: success()
      uses: actions/github-script@v6
      with:
        script: |
          await github.rest.repos.createDeploymentStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            deployment_id: ${{ steps.deployment.outputs.result }},
            state: 'success',
            environment_url: 'https://testtrack.example.com',
            description: 'Deployment to production successful'
          });
    
    - name: Create deployment status failure
      if: failure()
      uses: actions/github-script@v6
      with:
        script: |
          await github.rest.repos.createDeploymentStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            deployment_id: ${{ steps.deployment.outputs.result }},
            state: 'failure',
            description: 'Deployment to production failed'
          });
    
    - name: Notify deployment
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: 'Production deployment ${{ job.status }}'
        webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        fields: |
          repo,ref,commit,author
          version: ${{ steps.version.outputs.version }}
      continue-on-error: true

  rollback-on-failure:
    runs-on: ubuntu-latest
    needs: deploy-production
    if: failure()
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Configure SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/prod_key
        chmod 600 ~/.ssh/prod_key
        ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts
    
    - name: Rollback to previous version
      run: |
        ssh -i ~/.ssh/prod_key ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          cd /opt/testtrack-pro
          
          echo "Rolling back to previous version..."
          
          # Get previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 $(git rev-list --tags --skip=1 --max-count=1))
          echo "Rolling back to: $PREVIOUS_TAG"
          
          # Restore from backup
          BACKUP_DIR="/opt/testtrack-pro/backups"
          LATEST_BACKUP=$(ls -t $BACKUP_DIR/*.sql.gz | head -n 1)
          
          if [ -n "$LATEST_BACKUP" ]; then
            echo "Restoring database from: $LATEST_BACKUP"
            gunzip -c $LATEST_BACKUP | docker exec -i testtrack-pro-mysql mysql \
              -h localhost \
              -u testtrack \
              -p${MYSQL_PASSWORD} \
              testtrack_pro
          fi
          
          # Checkout previous version
          git checkout $PREVIOUS_TAG
          
          # Restart services with previous version
          docker-compose down
          docker pull ${{ secrets.DOCKER_REGISTRY }}/testtrack-pro:$PREVIOUS_TAG
          docker-compose up -d
          
          echo "Rollback complete!"
        EOF
    
    - name: Notify rollback
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: 'warning'
        text: 'Production deployment failed and rolled back'
        webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        fields: ref,commit,author
      continue-on-error: true

  post-deployment-validation:
    runs-on: ubuntu-latest
    needs: deploy-production
    if: success()
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Run production health checks
      run: |
        pip install requests pytest
        pytest tests/health/ -v --tb=short \
          --base-url=https://testtrack.example.com/api
      env:
        PRODUCTION_API_KEY: ${{ secrets.PRODUCTION_API_KEY }}
    
    - name: Monitor for errors
      run: |
        # Wait 30 seconds for application to stabilize
        sleep 30
        
        # Check application logs for errors
        ssh -i ~/.ssh/prod_key ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          docker logs testtrack-pro-backend --tail 100 | grep -i "error" || echo "No errors found"
        EOF
    
    - name: Create release notes
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const releaseNotes = `## Production Deployment Successful\n\nVersion: ${{ github.ref }}\nDate: ${new Date().toISOString()}\n\nChangelog:\n- Features and fixes deployed to production\n\nDeployment Details:\n- Backend: \`${{ secrets.DOCKER_REGISTRY }}/testtrack-pro:latest\`\n- URL: https://testtrack.example.com\n`;
          
          console.log(releaseNotes);
