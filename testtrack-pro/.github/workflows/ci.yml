name: CI - Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: testtrack_test
          MYSQL_USER: testtrack
          MYSQL_PASSWORD: testtrack123
          MYSQL_ROOT_PASSWORD: root123
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest pytest-cov black flake8 mypy
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 backend/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Code formatting check with black
      run: |
        black --check backend/ || true
    
    - name: Type checking with mypy
      run: |
        mypy backend/ || true
    
    - name: Wait for MySQL to be ready
      run: |
        for i in {1..30}; do
          mysqladmin ping -h"127.0.0.1" -u"root" -p"root123" && break
          echo 'MySQL not ready'
          sleep 1
        done
    
    - name: Initialize database
      run: |
        mysql -h127.0.0.1 -uroot -proot123 testtrack_test < database/schema.sql
      env:
        MYSQL_PWD: root123
    
    - name: Run backend tests
      run: |
        pytest backend/tests/ -v --cov=backend --cov-report=xml --tb=short
      env:
        MYSQL_HOST: 127.0.0.1
        MYSQL_USER: testtrack
        MYSQL_PASSWORD: testtrack123
        MYSQL_DATABASE: testtrack_test
        FLASK_ENV: testing
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm install || true
    
    - name: Lint HTML/CSS/JS
      run: |
        npm install -g htmlhint stylelint eslint || true
        htmlhint frontend/*.html || true
        eslint frontend/*.js || true

  docker-build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: false
        tags: testtrack-pro:latest
    
    - name: Test docker-compose configuration
      run: |
        docker-compose -f docker-compose.yml config > /dev/null

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install security tools
      run: |
        pip install bandit safety
    
    - name: Run bandit (security linter)
      run: |
        bandit -r backend/ -f json -o bandit-report.json || true
    
    - name: Check for known vulnerabilities
      run: |
        pip install --upgrade pip
        pip install -r backend/requirements.txt
        safety check --json || true

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r backend/requirements.txt
        pip install pylint pytest-pylint
    
    - name: Run pylint
      run: |
        pylint backend/ --exit-zero --output-format=parseable || true

  build-status:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, docker-build, security-scan]
    if: always()
    
    steps:
    - name: Check build status
      run: |
        if [ "${{ needs.backend-tests.result }}" = "failure" ] || [ "${{ needs.frontend-tests.result }}" = "failure" ] || [ "${{ needs.docker-build.result }}" = "failure" ]; then
          echo "CI Pipeline Failed"
          exit 1
        fi
        echo "CI Pipeline Passed"
