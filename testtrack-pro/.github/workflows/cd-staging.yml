name: CD - Deploy to Staging

on:
  push:
    branches: [ develop ]
  workflow_run:
    workflows: [ "CI - Build and Test" ]
    types: [ completed ]
    branches: [ develop ]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    
    environment:
      name: staging
      url: https://staging.testtrack.example.com
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ secrets.DOCKER_REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_REGISTRY }}/testtrack-pro:staging-latest
          ${{ secrets.DOCKER_REGISTRY }}/testtrack-pro:staging-${{ github.sha }}
    
    - name: Configure SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/staging_key
        chmod 600 ~/.ssh/staging_key
        ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts
    
    - name: Deploy to Staging Server
      run: |
        ssh -i ~/.ssh/staging_key ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
          cd /opt/testtrack-pro
          
          # Pull latest code
          git pull origin develop
          
          # Update environment
          cp .env.staging .env
          
          # Pull latest Docker image
          docker pull ${{ secrets.DOCKER_REGISTRY }}/testtrack-pro:staging-latest
          
          # Restart services
          docker-compose down
          docker-compose up -d
          
          # Run database migrations
          docker exec testtrack-pro-backend python database/migrate.py
          
          # Health check
          sleep 10
          curl http://localhost:5000/health || exit 1
        EOF
    
    - name: Run Smoke Tests on Staging
      run: |
        npm install -g newman
        newman run ./tests/postman/testtrack-pro-staging.json \
          --environment ./tests/postman/staging.environment.json \
          --reporters cli,json \
          --reporter-json-export results.json
      continue-on-error: true
    
    - name: Notify Deployment
      if: always()
      uses: actions/github-script@v6
      with:
        script: |
          const status = '${{ job.status }}';
          const deploymentUrl = 'https://staging.testtrack.example.com';
          const message = status === 'success' 
            ? `✅ Deployment to staging successful: ${deploymentUrl}`
            : `❌ Deployment to staging failed`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: message
          });

  test-staging:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: needs.deploy-staging.result == 'success'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install test dependencies
      run: |
        pip install requests pytest selenium
    
    - name: Run API tests against staging
      run: |
        pytest tests/api/ -v --tb=short \
          --base-url=https://staging.testtrack.example.com/api
      env:
        STAGING_API_KEY: ${{ secrets.STAGING_API_KEY }}
    
    - name: Run smoke tests
      run: |
        pytest tests/smoke/ -v --tb=short \
          --base-url=https://staging.testtrack.example.com
      env:
        STAGING_API_KEY: ${{ secrets.STAGING_API_KEY }}

  performance-test-staging:
    runs-on: ubuntu-latest
    needs: test-staging
    if: always()
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install performance test tools
      run: |
        pip install locust
    
    - name: Run load tests
      run: |
        locust -f tests/load/locustfile.py \
          --host=https://staging.testtrack.example.com \
          --users=100 \
          --spawn-rate=10 \
          --run-time=5m \
          --csv=load_test_results
      continue-on-error: true
    
    - name: Upload performance results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-test-results
        path: load_test_results*

  security-check-staging:
    runs-on: ubuntu-latest
    needs: deploy-staging
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Run OWASP ZAP Scan
      run: |
        docker run -t owasp/zap2docker-stable zap-baseline.py \
          -t https://staging.testtrack.example.com \
          -J report.json || true
    
    - name: Upload security scan results
      uses: actions/upload-artifact@v3
      with:
        name: security-scan-report
        path: report.json
